name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  host-checks:
    name: Host-side checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host check dependencies
        run: python -m pip install --upgrade pip pytest nanobind cmake mkdocs mkdocs-macros-plugin

      - name: Run consolidated host-side checks
        run: make dev-check

      - name: Compile affected standalone tools
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra tools/cdce937_dump/cdce937_dump.cc -o /tmp/cdce937_dump
          g++ -std=c++17 -O2 -Wall -Wextra tools/rle32_to_vcd/rle32_to_vcd.cc -o /tmp/rle32_to_vcd
          make -C tools/spi_payload clean && make -C tools/spi_payload

  icarus-tests:
    name: Icarus testbenches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run Icarus testbenches
        run: make -C ip -j4 test-icarus

      - name: Check runner isolation, failure propagation and required scenarios
        run: python3 -m unittest discover -s ip/testbench -p 'test_*.py'

      - name: Check exhaustive trigger oracle against injected defects
        run: python3 ip/streamer/tb_chain_trigger/test_faults.py --primitive-only --sim icarus

      - name: Upload simulation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: icarus-diagnostics
          include-hidden-files: true
          path: |
            ip/**/.sim/**/run.log
            ip/**/.sim/**/run.json
